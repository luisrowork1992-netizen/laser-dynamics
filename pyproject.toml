[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-dynamics"
version = "0.1.0"
description = "Four-level laser rate equations: threshold, relaxation oscillations, Q-switching and cavity design"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["lasersim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
